resources:
  repositories:
    - repository: template
      type: git
      name: 'Templates/Template'
      ref: dev
      
trigger: none

variables:
- group: secrets
      
stages:
- stage: Build
  jobs:
  - job: Build
    variables:
      build.clean: all
      platform: x64
      version: "current"
      appVersion: "1.0"
      appBuild: $[counter(variables['appVersion'],0)]
      appRevision: 0
      createRuntimePackages: False
      skipComponentGovernanceDetection: True

    pool:
      name: Default

    steps:
    - template: build-steps.yml@template

- stage: Release
  dependsOn: Build
  jobs:
    - deployment: "Release_D"
      variables:
        version: "cronus_de"
      pool:
        name: Default
      environment: environment_1
      strategy:
        runOnce:
          deploy:
            steps:
            - template: release-steps.yml@template
