resources:
  repositories:
    - repository: templates
      type: git
      name: Template
      
trigger: none
schedules:
- cron: '0 1 * * SAT'
  displayName: Weekly Next Major build
  branches:
    include:
    - master
  always: true

variables:
- group: secrets
      
stages:
- stage: Build
  jobs:
  - job: Build
    variables:
      build.clean: all
      platform: x64
      version: "nextmajor"
      appVersion: "1.0"
      appBuild: $[counter(variables['appVersion'],40000)]
      appRevision: 0
      createRuntimePackages: False
      skipComponentGovernanceDetection: True

    pool:
      name: Default

    steps:
    - template: build-steps.yml@templates